[project]
name = "spasht-backend"
version = "0.1.0"
description = "Spasht - voice-first loan clarity co-pilot (concept demo for Paytm Build for India AI Hackathon)"
requires-python = ">=3.11,<3.14"

# Versions are pinned exactly: this is demoed live and must not drift.
dependencies = [
  "fastapi==0.121.2",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.4",
  "pydantic-settings==2.13.0",
  "sqlalchemy==2.0.45",
  "alembic==1.17.1",
  "psycopg[binary]==3.2.12",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  # Auth: firebase-admin is the primary verifier; google-auth is the fallback
  # path for machines with no service-account credentials (plan section 13).
  "firebase-admin==7.7.0",
  "google-auth==2.62.0",
  # Trust layer (phase 6): Ed25519 receipt signatures and AES-256-GCM transcripts.
  "pynacl==1.6.0",
  "cryptography==46.0.3",
  # Sample KFS PDFs (phase 2) and the offline text fallback (phase 11).
  "reportlab==4.4.4",
  "pdfplumber==0.11.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------- ruff -----------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "ASYNC",    # async gotchas
  "BLE",      # blind except - must be justified with a noqa reason
  "S",        # bandit (security)
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",
]
ignore = [
  "E501",  # line length is handled by the formatter
  # RUF001-003 flag Devanagari characters as "ambiguous" lookalikes for Latin
  # ones. This product is written in Marathi and Hindi: the whole point is that
  # the customer-facing strings, the lexicons and the comments explaining them
  # are in Devanagari, so the rule fires on correct code throughout.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and hard-coded demo values.
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

# ----------------------------- pytest -----------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
